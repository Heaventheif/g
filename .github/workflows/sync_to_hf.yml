name: Sync to Hugging Face Space

on:
  push:
    branches:
      - main          # يُشغَّل عند كل push على الفرع الرئيسي
  workflow_dispatch:  # أو يدوياً من واجهة GitHub

jobs:
  # ─── بوابة الجودة: لا يُنشر شيء إلى HF إلا إذا نجح التنسيق والفحص والاختبارات ───
  test:
    name: Format, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Stockfish مطلوب لاختبار البوت الحقيقي في plugins/chess (يُتخطى تلقائياً إن غاب)
      - name: Install stockfish
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends stockfish
      # يفشل إن كان go.mod/go.sum غير مرتَّبين — البناء في Docker بـ -mod=readonly
      # ولا يُصلح شيئاً بنفسه (Go >= 1.23 لـ -diff). ملاحظة: `go mod tidy` لا يقبل
      # -tags؛ هو يعامل كل وسوم البناء (ومنها postgres) كأنها مفعّلة، فلا حاجة لها.
      - name: go mod tidy (no diff)
        run: go mod tidy -diff
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./... && go vet -tags postgres ./...
      - name: go test
        run: go test -race ./...

  sync-to-hf:
    name: Push to HuggingFace Space
    needs: test
    runs-on: ubuntu-latest

    steps:
      # ─── 1. استنساخ المستودع مع كامل التاريخ ─────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # كامل التاريخ ضروري لـ git push صحيح
          lfs: true            # تحميل ملفات Git LFS (مطلوب لـ .gitattributes الخاص بـ HF)

      # ─── 2. إعداد Git LFS ─────────────────────────────────────────────────
      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs pull

      # ─── 3. ضبط هوية Git ──────────────────────────────────────────────────
      - name: Configure Git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name  "github-actions[bot]"

      # ─── 4. إضافة remote الخاص بـ HuggingFace ────────────────────────────
      - name: Add HuggingFace remote
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # الصيغة: https://<username>:<token>@huggingface.co/spaces/<owner>/<space>
          git remote add hf \
            "https://kiyunhai:${HF_TOKEN}@huggingface.co/spaces/kiyunhai/g"

      # ─── 5. دفع الكود إلى HuggingFace Space ──────────────────────────────
      - name: Push to HuggingFace Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push hf main --force
          # --force مفيد لتجاوز أي commit تلقائي من HF (مثل تحديث README)

      # ─── 6. (اختياري) التحقق عبر huggingface_hub ─────────────────────────
      # هذه الخطوة تطبع معلومات الـ Space بعد النشر للتأكد من نجاحه
      - name: Verify deployment via huggingface_hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi

          api  = HfApi(token=os.environ["HF_TOKEN"])
          info = api.space_info(repo_id="kiyunhai/g")

          # cardData قد تكون None (فضاء بلا README YAML بعد) — لا تفترض وجودها
          card = info.cardData or {}
          sdk  = card.get("sdk", "N/A")

          # runtime قد تكون None قبل أول build
          runtime = info.runtime
          stage   = getattr(runtime, "stage", "N/A") if runtime else "N/A"

          print(f"✅ Space : {info.id}")
          print(f"   SDK   : {sdk}")
          print(f"   URL   : https://huggingface.co/spaces/{info.id}")
          print(f"   Stage : {stage}")
          PY
